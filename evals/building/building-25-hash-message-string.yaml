id: building-25-hash-message-string
pillar: building
title: personal_sign of a hex-looking string
kind: quiz
summary: The characters, not the bytes. The prefix length follows.
prompt: |
  A dapp calls personal_sign with the message given as the ten-character text string 0xdeadbeef — the characters, not four bytes. What 32-byte digest does the wallet actually sign?
  End your reply with a line of the form "Answer: 0x<hex>".
grader:
  type: exact
  expect: '0xefedd0a9a0294228c3977d7fbb68c7d40279f8b408cf3e24ef1823b179709e58'
reference: 'Answer: 0xefedd0a9a0294228c3977d7fbb68c7d40279f8b408cf3e24ef1823b179709e58'
checks:
