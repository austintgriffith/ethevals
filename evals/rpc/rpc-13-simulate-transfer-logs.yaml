id: rpc-13-simulate-transfer-logs
pillar: rpc
title: ETH transfers as logs
kind: quiz
summary: eth_simulateV1 with traceTransfers reports ETH moves as ERC-20 Transfer logs from 0xeeee…eeee.
prompt: |
  A wallet previews a plain ETH transfer with eth_simulateV1 and sets "traceTransfers": true:

    {"blockStateCalls": [{"stateOverrides": {"0xc000000000000000000000000000000000000000": {"balance": "0x7d0"}}, "calls": [{"from": "0xc000000000000000000000000000000000000000", "to": "0xc100000000000000000000000000000000000000", "value": "0x3e8"}]}], "traceTransfers": true}

  The call succeeds and its `logs` array has exactly one entry. Give its address, topics and data.
  Reply with JSON only: {"address": "0x...", "topics": ["0x...", ...], "data": "0x..."}
grader:
  type: json
  expect:
    address: '0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee'
    topics:
    - '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef'
    - '0x000000000000000000000000c000000000000000000000000000000000000000'
    - '0x000000000000000000000000c100000000000000000000000000000000000000'
    data: '0x00000000000000000000000000000000000000000000000000000000000003e8'
reference: '{"address": "0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee", "topics": ["0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef",
  "0x000000000000000000000000c000000000000000000000000000000000000000", "0x000000000000000000000000c100000000000000000000000000000000000000"],
  "data": "0x00000000000000000000000000000000000000000000000000000000000003e8"}'
checks:
  must_fail:
  - '{"address": "0x0000000000000000000000000000000000000000", "topics": ["0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef",
    "0x000000000000000000000000c000000000000000000000000000000000000000", "0x000000000000000000000000c100000000000000000000000000000000000000"],
    "data": "0x00000000000000000000000000000000000000000000000000000000000003e8"}'
  - '{"address": "0xc000000000000000000000000000000000000000", "topics": ["0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef",
    "0x000000000000000000000000c000000000000000000000000000000000000000", "0x000000000000000000000000c100000000000000000000000000000000000000"],
    "data": "0x00000000000000000000000000000000000000000000000000000000000003e8"}'
  - '{"address": "0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee", "topics": ["0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"],
    "data": "0x00000000000000000000000000000000000000000000000000000000000003e8"}'
source:
  repo: ethereum/execution-apis
  task: tests/eth_simulateV1/ethSimulate-eth-send-should-produce-logs.io
